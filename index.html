<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1322" />
    <meta name="description" content="Don't Fall Arena — olti burchakli plitalar qulab tushadigan arenada oxirgi bo'lib qolish uchun kurashing." />
    <title>Don't Fall Arena</title>
    <link rel="stylesheet" href="./styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpolygon points='32,4 56,18 56,46 32,60 8,46 8,18' fill='%2339d98a' stroke='%2304121a' stroke-width='4'/%3E%3Cpolygon points='32,20 44,27 44,41 32,48 20,41 20,27' fill='%2304121a'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>

      <!-- ============================================================ HUD -->
      <div id="hud" class="hud hidden">
        <div class="hud-top">
          <div class="pill" id="hudRound">RAUND 1</div>
          <div class="timer" id="hudTimer">1:20</div>
          <div class="pill" id="hudAlive">4 TIRIK</div>
        </div>

        <div class="scores" id="hudScores"></div>

        <div class="center-msg" id="hudMsg"><span></span></div>
        <div class="sub-msg" id="hudSubMsg"><span></span></div>

        <div class="hud-bottom">
          <div class="dash-meter" id="dashMeter">
            <svg viewBox="0 0 44 44" aria-hidden="true">
              <circle class="dm-bg" cx="22" cy="22" r="18" />
              <circle class="dm-fg" id="dashRing" cx="22" cy="22" r="18" />
            </svg>
            <span>DASH</span>
          </div>
          <div class="effects" id="hudEffects"></div>
          <div class="hint" id="hudHint"></div>
        </div>

        <div class="killfeed" id="killfeed"></div>
        <div class="toasts" id="toasts"></div>

        <button class="icon-btn pause-btn" id="btnPause" title="ESC">❚❚</button>
        <button class="icon-btn sound-btn" id="btnSound" title="M">🔊</button>
      </div>

      <!-- touch controls -->
      <div class="touch-ui hidden" id="touchUi">
        <div class="stick" id="touchStick"><div class="knob" id="touchKnob"></div></div>
        <button class="dash-btn" id="touchDash">SAKRA</button>
      </div>

      <!-- =========================================================== MENU -->
      <div id="menu" class="screen">
        <div class="panel menu-panel" id="menuRoot"></div>
      </div>

      <!-- ====================================================== ROUND END -->
      <div id="roundEnd" class="screen hidden">
        <div class="panel result-panel">
          <h2 id="reTitle">RAUND TUGADI</h2>
          <div class="results" id="reResults"></div>
          <div class="standings" id="reStandings"></div>
          <div class="re-next" id="reNext"></div>
        </div>
      </div>

      <!-- ====================================================== MATCH END -->
      <div id="matchEnd" class="screen hidden">
        <div class="panel result-panel">
          <div class="crown" id="meCrown">👑</div>
          <h2 id="meTitle">CHEMPION</h2>
          <p class="me-sub" id="meSub"></p>
          <div class="xp-line" id="meXp"></div>
          <div class="standings big" id="meStandings"></div>
          <div class="me-stats" id="meStats"></div>
          <div class="btn-row">
            <button class="big-btn green small" id="btnRematch">QAYTA O'YNASH</button>
            <button class="big-btn blue small" id="btnMenu">MENYU</button>
          </div>
        </div>
      </div>

      <!-- ========================================================== PAUSE -->
      <div id="pause" class="screen hidden">
        <div class="panel pause-panel">
          <h2 id="pauseTitle">PAUZA</h2>
          <div class="btn-col">
            <button class="big-btn green small" id="btnResume">DAVOM ETISH</button>
            <button class="big-btn blue small" id="btnRestart">QAYTA BOSHLASH</button>
            <button class="ghost" id="btnQuit">MENYUGA CHIQISH</button>
          </div>
          <div class="acc open" id="pauseTips">
            <details open>
              <summary>💡 Eslatmalar</summary>
              <ul>
                <li data-i18n="tip1"></li>
                <li data-i18n="tip2"></li>
                <li data-i18n="tip3"></li>
              </ul>
            </details>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
